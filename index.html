<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إلى أخي وصديقي سليمان</title>
  <style>
    body {
      background-color: #fff;
      color: #000;
      font-family: Tahoma, sans-serif;
      padding: 30px;
    }
    h1 {
      color: #d32f2f;
      font-size: 32px;
    }
    p {
      font-size: 20px;
      line-height: 1.8;
    }
    .highlight {
      color: #d32f2f;
      font-weight: bold;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>إلى أخي وصديقي سليمان</h1>

  <p>
    <span class="highlight">مرحبا سليمان،</span><br>
    عيد ميلاد سعيد! صح تأخرت عليك في أني أهنيك في عيد ميلادك،<br>
    لكن اعذرني، <span class="highlight">المهم</span> حبيت أقدم لك رسالة شكر بطريقتي الخاصة أو الغبية <span class="highlight">😂</span><br>
    المهم أنا <span class="highlight">أشكرك</span> وأشكر الله أن لي صديق وأخ مثلك <span class="highlight">♥</span>
  </p>

  <p>من أخوك و صديقك/ يـــمـــآن</p>

  <!-- مشغل الصوت -->
  <audio id="myAudio">
    <source src="AADDBB.mp3" type="audio/mpeg">
    المتصفح لا يدعم تشغيل الصوت.
  </audio>

  <!-- زر تشغيل -->
  <button onclick="document.getElementById('myAudio').play()">اضغط هنا يا سليمان</button>

</body>
</html>
