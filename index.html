<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>رسالة تهنئة لسليمان</title>
  <style>
    body {
      background-color: #fff;
      color: #000;
      font-family: Tahoma, sans-serif;
      padding: 30px;
      text-align: center;
    }
    h1 {
      color: #d32f2f;
      font-size: 32px;
    }
    p {
      font-size: 20px;
      line-height: 1.8;
    }
    .highlight {
      color: #d32f2f;
      font-weight: bold;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 20px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>إلى أخي وصديقي سليمان</h1>

  <p>
    <span class="highlight">مرحبا سليمان،</span><br />
    عيد ميلاد سعيد! صح تأخرت عليك في أني أهنيك في عيد ميلادك،<br />
    لكن اعذرني، <span class="highlight">المهم</span> حبيت أقدم لك رسالة شكر بطريقتي الخاصة<br />
    المهم أنا <span class="highlight">أشكرك</span> وأشكر الله أن لي صديق وأخ مثلك ♥
  </p>

  <p>من أخوك و صديقك/ يـــمـــآن</p>

  <audio id="myAudio">
    <source src="AAGGG.mp3" type="audio/mpeg" />
    المتصفح لا يدعم تشغيل الصوت.
  </audio>

  <button onclick="document.getElementById('myAudio').play()">افتح هديتك</button>

</body>
</html>
