<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>هديتك هنا</title>
  <style>
    body {
      background: linear-gradient(270deg, #ff00cc, #3333ff, #00ffcc, #ffcc00);
      background-size: 800% 800%;
      animation: gradientBG 20s ease infinite;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      text-align: center;
      color: white;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .container {
      margin-top: 100px;
    }
    h1 {
      font-size: 3em;
    }
    audio {
      margin-top: 20px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1.2em;
      cursor: pointer;
      background-color: #cc0000;
      color: white;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #ff3333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>عيد ميلاد سعيد يا سليمان</h1>
    <p>افتح هديتك هنا</p>
    <button id="openGiftBtn">افتح هديتك</button>
    <audio id="audioPlayer" controls style="display:none; margin-top:20px;">
      <source src="happy.mp3" type="audio/mpeg" />
      متصفحك لا يدعم تشغيل الصوت.
    </audio>
  </div>
  <script>
    const btn = document.getElementById('openGiftBtn');
    const audio = document.getElementById('audioPlayer');
    btn.addEventListener('click', () => {
      audio.style.display = 'block';
      audio.play();
      btn.disabled = true;
      btn.textContent = 'تم فتح الهدية';
    });
  </script>
</body>
</html>
