<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>محرر الكود</title>
  <style>
    body {
      font-family: monospace;
      background-color: #f0f0f0;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 80vh;
      font-family: monospace;
      font-size: 16px;
      background-color: #fff;
      border: 1px solid #ccc;
      padding: 10px;
      box-sizing: border-box;
      white-space: pre;
      direction: rtl;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #d32f2f;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h2>محرر صفحة index.html</h2>
  <textarea id="codeEditor"></textarea>
  <br />
  <button onclick="saveFile()">حفظ التغييرات</button>

  <script>
    // تحميل الكود من ملف index.html عبر fetch (لو تستضيفه على سيرفر)
    // لكن في محلي (Termux) هذا ما يشتغل، لذا نحتاج طريقة ثانية.
    // هنا فقط مثال لتعبئة التاكسيتيرا يدوياً:
    
    // لو تحط الكود هنا مباشرة:
    const initialCode = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>إلى أخي وصديقي سليمان</title>
  <style>
    body {
      background-color: #fff;
      color: #000;
      font-family: Tahoma, sans-serif;
      padding: 30px;
      text-align: center;
    }
    h1 {
      color: #d32f2f;
      font-size: 32px;
    }
    p {
      font-size: 20px;
      line-height: 1.8;
    }
    .highlight {
      color: #d32f2f;
      font-weight: bold;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 20px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #b71c1c;
    }
  </style>
</head>
<body>

  <h1>إلى أخي وصديقي سليمان</h1>

  <p>
    <span class="highlight">مرحبا سليمان،</span><br />
    عيد ميلاد سعيد! صح تأخرت عليك في أني أهنيك في عيد ميلادك،<br />
    لكن اعذرني، <span class="highlight">المهم</span> حبيت أقدم لك رسالة شكر بطريقتي الخاصة أو الغبية <span class="highlight">😂</span><br />
    المهم أنا <span class="highlight">أشكرك</span> وأشكر الله أن لي صديق وأخ مثلك <span class="highlight">♥</span>
  </p>

  <p>من أخوك و صديقك/ يـــمـــآن</p>

  <!-- مشغل الصوت بدون autoplay -->
  <audio id="myAudio">
    <source src="ggaaggaa.mp3" type="audio/mpeg" />
    المتصفح لا يدعم تشغيل الصوت.
  </audio>

  <!-- زر تشغيل -->
  <button onclick="document.getElementById('myAudio').play()">افتح هديتك</button>

</body>
</html>`;

    document.getElementById('codeEditor').value = initialCode;

    function saveFile() {
      const code = document.getElementById('codeEditor').value;
      // للأسف في متصفح عادي لا يمكنك كتابة ملف في النظام مباشرة.
      // تحتاج رفع المحتوى للسيرفر أو نسخ التعديلات يدوياً.
      alert('لتحفظ التغييرات، انسخ المحتوى وألصقه في ملف index.html في محرر Termux أو جهازك.');
    }
  </script>
</body>
</html>
