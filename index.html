<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>إلى أخي وصديقي سليمان</title>
  <style>
    body {
      background: url('XXCC.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Tahoma, sans-serif;
      padding: 30px;
      text-align: center;
      color: white;
      text-shadow: 1px 1px 4px black;
      position: relative;
      overflow: hidden;
    }

    h1 {
      color: #b71c1c;
      font-size: 32px;
      text-shadow: 2px 2px 6px black;
    }

    p {
      font-size: 20px;
      line-height: 1.8;
    }

    .highlight {
      color: #d32f2f;
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 20px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background-color 0.3s;
      position: relative;
      z-index: 10;
    }

    button:hover {
      background-color: #b71c1c;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: -1;
    }

    /* الطبقة التي تحتوي على الألوان المتغيرة عند الأطراف */
    #colorEdges {
      pointer-events: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 3px solid transparent;
      box-sizing: border-box;
      border-image-slice: 1;
      border-image-source: linear-gradient(270deg, red, orange, yellow, green, blue, indigo, violet, red);
      border-width: 6px;
      border-radius: 0;
      animation: colorShift 5s linear infinite;
      opacity: 0;  /* مخفي بشكل افتراضي */
      transition: opacity 0.5s ease;
      z-index: 9;
    }

    /* تحريك تغير لون الحدود */
    @keyframes colorShift {
      0% {
        border-image-source: linear-gradient(270deg, red, orange, yellow, green, blue, indigo, violet, red);
      }
      100% {
        border-image-source: linear-gradient(630deg, red, orange, yellow, green, blue, indigo, violet, red);
      }
    }

    /* تأثيرات الصندوق */
    .gift-box {
      width: 200px;
      height: 200px;
      background-color: red;
      border-radius: 10px;
      position: relative;
      margin: 0 auto;
      display: none;
      overflow: hidden;
    }

    .gift-box .lid {
      width: 100%;
      height: 50%;
      background-color: darkred;
      position: absolute;
      top: 0;
      left: 0;
      transition: top 1s;
    }

    .gift-box .content {
      width: 100%;
      height: 100%;
      background-color: red;
      position: absolute;
      top: 50%;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 1s;
    }

    .gift-box .content .roses {
      width: 50px;
      height: 50px;
      background-color: darkred;
      border-radius: 50%;
      margin: 5px;
    }

    .gift-box .content .letters {
      position: absolute;
      bottom: 10px;
      font-size: 24px;
      color: white;
      opacity: 0;
      transition: opacity 1s;
    }

    /* تأثيرات الأحرف */
    @keyframes lettersAnimation {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* تأثيرات الورود */
    @keyframes rosesAnimation {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

  </style>
</head>
<body>

  <h1>إلى أخي وصديقي سليمان</h1>

  <p>
    <span class="highlight">مرحبا سليمان،</span><br />
    عيد ميلاد سعيد! صح تأخرت عليك في أني أهنيك في عيد ميلادك،<br />
    لكن اعذرني، <span class="highlight">المهم</span> حبيت أقدم لك رسالة شكر بطريقتي الخاصة أو الغبية <span class="highlight">😂</span><br />
    المهم أنا <span class="highlight">أشكرك</span> وأشكر الله أن لي صديق وأخ مثلك <span class="highlight">♥</span>
  </p>

  <p>من أخوك و صديقك/ يـــمـــآن</p>

  <audio id="myAudio" loop>
    <source src="AAGGG.mp3" type="audio/mpeg" />
    المتصفح لا يدعم تشغيل الصوت.
  </audio>

  <button id="playBtn">افتح هديتك</button>

  <!-- طبقة الألوان المتغيرة عند الأطراف -->
  <div id="colorEdges"></div>

  <!-- صندوق الهدية -->
  <div class="gift-box" id="giftBox">
    <div class="lid"></div>
    <div class="content">
      <div class="roses"></div>
      <div class="roses"></div>
      <div class="roses"></div>
      <div class="letters">عيد ميلاد سعيد يا سليمان</div>
    </div>
  </div>

  <script>
    const audio = document.getElementById('myAudio');
    const playBtn = document.getElementById('playBtn');
    const colorEdges = document.getElementById('colorEdges');
    const giftBox = document.getElementById('giftBox');
    const lid = giftBox.querySelector('.lid');
    const content = giftBox.querySelector('.content');
    const roses = content.querySelectorAll('.roses');
    const letters = content.querySelector('.letters');

    playBtn.addEventListener('click', () => {
      audio.play();
      // إظهار الألوان عند الأطراف
      colorEdges.style.opacity = '1';
      // إظهار صندوق الهدية
      giftBox.style.display = 'block';
      // فتح الغطاء
      lid.style.top = '-50%';
      // إظهار الورود
      roses.forEach((rose, index) => {
        setTimeout(() => {
          rose.style.animation = 'rosesAnimation 1s forwards';
        }, index * 300);
      });
      // إظهار الأحرف
      setTimeout(() => {
        letters.style.animation = 'lettersAnimation 1s forwards';
      }, roses.length * 300);
    });

    // اختياري: لو وقف الصوت، نخفي الألوان
    audio.addEventListener('ended', () => {
      colorEdges.style.opacity = '0';
      giftBox.style.display = 'none';
    });
  </script>

</body>
</html>
