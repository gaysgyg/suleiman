<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>إلى أخي وصديقي سليمان</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Tahoma, sans-serif;
      color: #fff;
      text-align: center;
      position: relative;
      min-height: 100vh;
    }

    /* صورة الخلفية كطبقة */
    body::before {
      content: "";
      background: url('XXCC.jpg') no-repeat center center fixed;
      background-size: cover;
      opacity: 0.4; /* الشفافية للصورة */
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .content {
      padding: 50px 20px;
    }

    h1 {
      color: #ffd700;
      font-size: 36px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      line-height: 1.8;
    }

    .highlight {
      color: #ff5252;
      font-weight: bold;
    }

    button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 20px;
      background-color: #ff5252;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #e53935;
    }
  </style>
</head>
<body>

  <div class="content">
    <h1>إلى أخي وصديقي سليمان</h1>

    <p>
      <span class="highlight">مرحبا سليمان،</span><br />
      عيد ميلاد سعيد! صح تأخرت عليك في أني أهنيك في عيد ميلادك،<br />
      لكن اعذرني، <span class="highlight">المهم</span> حبيت أقدم لك رسالة شكر بطريقتي الخاصة أو الغبية <span class="highlight">😂</span><br />
      المهم أنا <span class="highlight">أشكرك</span> وأشكر الله أن لي صديق وأخ مثلك <span class="highlight">♥</span>
    </p>

    <p>من أخوك و صديقك/ يـــمـــآن</p>

    <audio id="myAudio">
      <source src="AAGGG.mp3" type="audio/mpeg" />
      المتصفح لا يدعم تشغيل الصوت.
    </audio>

    <button onclick="document.getElementById('myAudio').play()">افتح هديتك</button>
  </div>

</body>
</html>
