<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    position: relative;
    font-family: Tahoma, sans-serif;
    text-align: center;
    color: white;
  }
  .background-image {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: url('XXCC.jpg') no-repeat center center/cover;
    opacity: 0.5; /* خفف الشفافية شوي */
    z-index: -1;
  }
  .content {
    position: relative;
    z-index: 1;
    padding: 30px;
    max-width: 800px; /* عشان النص ما يملأ الصفحة كلها */
    margin: auto;
    background-color: rgba(0, 0, 0, 0.3); /* خلفية شفافة للنص */
    border-radius: 15px;
  }
  /* أيقونة الواتس اب داخل المحتوى، أسفل اليمين */
  .whatsapp-icon-container {
    position: relative;
  }
  .whatsapp-icon {
    position: absolute;
    bottom: 10px;  /* 10 بكسل من الأسفل */
    right: 10px;   /* 10 بكسل من اليمين */
    width: 60px;   /* حجم أكبر */
    height: 60px;
    cursor: pointer;
    filter: drop-shadow(1px 1px 2px black); /* توضيح الظل */
    transition: transform 0.3s;
  }
  .whatsapp-icon:hover {
    transform: scale(1.2);
  }
  /* النص مع توهج */
  p, h1, span {
    text-shadow: 1px 1px 3px black;
  }
</style>

<div class="background-image"></div>

<div class="content whatsapp-icon-container">
  <h1>إلى أخي وصديقي سليمان</h1>
  <p>
    <span style="color: yellow;">مرحباً سليمان،</span><br/>
    عيد ميلاد سعيد! صح تأخرت عليك في أني أهنيك في عيد ميلادك،<br/>
    لكن اعذرني، <span style="color: red; font-weight: bold;">المهم</span> حبيت أقدم لك رسالة شكر لهدفك الخاص<br/>
    أنا المهم <span style="color: red; font-weight: bold;">أشكرك</span> وأشكر الله أن لي صديق وأخ مثلك ♥
  </p>
  <p>من أخوك و صديقك/ يـــمـــآن</p>
  <audio id="myAudio">
    <source src="AAGGG.mp3" type="audio/mpeg" />
    إصدار لا يدعم تشغيل الصوت.
  </audio>
  <button onclick="document.getElementById('myAudio').play()">تسجيل هديتك</button>

  <!-- أيقونة الواتس اب -->
  <a href="https://wa.me/967730219109" target="_blank" rel="noopener noreferrer">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" class="whatsapp-icon" />
  </a>
</div>
