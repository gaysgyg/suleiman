<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>إلى أخي وصديقي سليمان</title>
  <style>
    body {
      background-image: url('XXCC.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      color: white;
      font-family: Tahoma, sans-serif;
      padding: 30px;
      text-align: center;
    }
    /* طبقة شفافة فوق الخلفية */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.35); /* تقليل الشفافية قليلاً */
      z-index: -1;
    }
    h1 {
      color: #f9a825; /* أصفر مناسب */
      font-size: 32px;
      text-shadow: 1px 1px 4px black;
    }
    p {
      font-size: 20px;
      line-height: 1.8;
      text-shadow: 1px 1px 4px black; /* توهج خفيف للنص */
    }
    .highlight {
      color: #d32f2f;
      font-weight: bold;
      text-shadow: 1px 1px 4px black;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 20px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #b71c1c;
    }
    /* أيقونة الواتساب */
    .whatsapp {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: #25d366;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.3s;
      z-index: 1000;
    }
    .whatsapp:hover {
      background-color: #128c4a;
    }
    .whatsapp svg {
      width: 32px;
      height: 32px;
      fill: white;
    }
  </style>
</head>
<body>

  <h1>إلى أخي وصديقي سليمان</h1>

  <p>
    <span class="highlight">مرحبا سليمان،</span><br />
    عيد ميلاد سعيد! صح تأخرت عليك في أني أهنيك في عيد ميلادك،<br />
    لكن اعذرني، <span class="highlight">المهم</span> حبيت أقدم لك رسالة شكر بطريقتي الخاصة أو الغبية<br />
    المهم أنا <span class="highlight">أشكرك</span> وأشكر الله أن لي صديق وأخ مثلك ♥
  </p>

  <p>من أخوك و صديقك/ يـــمـــآن</p>

  <!-- مشغل الصوت -->
  <audio id="myAudio">
    <source src="AAGGG.mp3" type="audio/mpeg" />
    المتصفح لا يدعم تشغيل الصوت.
  </audio>

  <!-- زر تشغيل -->
  <button onclick="document.getElementById('myAudio').play()">افتح هديتك</button>

  <!-- أيقونة واتساب -->
  <a href="https://wa.me/967730219109" target="_blank" class="whatsapp" aria-label="اتصل بي على واتساب">

    </svg>
  </a>

</body>
</html>
